    <text x="820" y="1580" fill-opacity=".35">1. ALL DIMENSIONS IN POINTS UNLESS NOTED.</text>
    <text x="820" y="1598" fill-opacity=".35">2. CORNERS CONTINUOUS (SQUIRCLE).</text>
    <text x="820" y="1616" fill-opacity=".35">3. KEEP IT SIMPLE. THEN SIMPLER.</text>
    <text x="1180" y="1890" fill-opacity=".3">REV 1.0</text>
