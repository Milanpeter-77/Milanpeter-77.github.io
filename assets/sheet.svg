    <rect x="170" y="0" width="320" height="150" rx="24"/>
    <rect x="0" y="170" width="320" height="320" rx="24" stroke-dasharray="6 6"/>
    <circle cx="75" cy="75" r="40" stroke-opacity=".25"/>
