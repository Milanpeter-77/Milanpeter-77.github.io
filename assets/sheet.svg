<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2000" viewBox="0 0 1440 2000" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" letter-spacing="1.5">
